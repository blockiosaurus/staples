# Railway config-as-code for a Staples trial instance. See doc/RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The image's default target is `production`. It listens on $PORT (Railway
# injects it and it overrides the image's PORT=3100) and binds HOST=0.0.0.0.
healthcheckPath = "/api/health"
# First boot applies database migrations before the server listens.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
