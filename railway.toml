# Railway config-as-code for a Staples trial instance. See doc/RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway builds the Dockerfile's last stage, `railway` (an alias of
# `production`). It listens on $PORT (Railway
# injects it and it overrides the image's PORT=3100) and binds HOST=0.0.0.0.
# Needs PAPERCLIP_ALLOWED_HOSTNAMES=healthcheck.railway.app (see doc/RAILWAY.md).
healthcheckPath = "/api/health"
# First boot applies database migrations before the server listens.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
