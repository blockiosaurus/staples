# Railway config-as-code for a Staples trial instance. See doc/RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway builds the Dockerfile's last stage, `railway` (an alias of
# `production`). It listens on $PORT; set the service
# variable PORT=3100 and use 3100 as the public domain's target port and binds HOST=0.0.0.0.
# Needs PAPERCLIP_ALLOWED_HOSTNAMES=healthcheck.railway.app (see doc/RAILWAY.md).
healthcheckPath = "/api/health"
# First boot applies database migrations before the server listens.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
